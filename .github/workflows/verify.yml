name: Verify

on:
  push:
    branches: [main, "codex/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  foundation:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - name: Restore
        run: dotnet restore IPS.Middleware.slnx
      - name: Build
        run: dotnet build IPS.Middleware.slnx --configuration Release --no-restore
      - name: Test
        run: dotnet test IPS.Middleware.slnx --configuration Release --no-build --logger trx --results-directory TestResults
      - name: Check formatting
        run: dotnet format IPS.Middleware.slnx --verify-no-changes --no-restore --exclude src/IPS.MiidleWear.Contracts
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: TestResults/**/*.trx
          if-no-files-found: ignore
